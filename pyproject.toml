[tool.ruff]
line-length = 79
target-version = 'py311'
src = ['.']

[tool.ruff.lint]
select = [
    'E',    # pycodestyle errors
    'W',    # pycodestyle warnings
    'F',    # pyflakes
    'I',    # isort
    'B',    # flake8-bugbear
    'C4',   # flake8-comprehensions
    'UP',   # pyupgrade
    'SIM',  # flake8-simplify
    'RET',  # flake8-return
    'ARG',  # unused arguments
    'PTH',  # use pathlib
    'N',    # pep8-naming
]
ignore = [
    'B008',  # FastAPI puts Depends()/Query() in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['ARG001']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q'
filterwarnings = [
    'ignore::DeprecationWarning',
]
